# Training settings (committed, R-M10t). TODO(human): fill dataset_hash from dataset_card.md before training.
base_model: Qwen/Qwen2.5-1.5B-Instruct
method: qlora
load_in_4bit: true
lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
lr: 2.0e-4
epochs: 3
batch_size: 8
grad_accum: 1
max_seq_len: 2048
train_on: assistant_only
seed: 42
early_stopping: {metric: eval_loss, patience: 1}
dataset_hash: TODO
quantize: Q4_K_M
