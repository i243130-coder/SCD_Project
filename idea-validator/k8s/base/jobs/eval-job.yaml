apiVersion: batch/v1
kind: Job
metadata:
  name: eval-job
  namespace: idea-validator
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: evaluation
        tier: internal
    spec:
      restartPolicy: OnFailure
      containers:
      - name: eval
        image: registry/evaluation:set-by-deploy
        args:
        - python
        - -m
        - src.harness
        envFrom:
        - configMapRef:
            name: service-urls
        - configMapRef:
            name: common-config
        - secretRef:
            name: app-secrets
            optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
