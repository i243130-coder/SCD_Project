[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "brief", "services/ui", "jobs/finetune/train_colab.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
exclude = ["\\.venv", "tests/", "alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"

[tool.ruff.lint.isort]
known-first-party = ["ivcommon", "src", "tests"]

[tool.ruff.lint.per-file-ignores]
"eval/behaviour/test_behaviour.py" = ["E402", "E401", "I001"]
"scripts/*.py" = ["E402"]
"k8s/generate.py" = ["E731"]
