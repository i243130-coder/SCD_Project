apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: idea-validator
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: data
    spec:
      securityContext:
        fsGroup: 70
      containers:
      - name: postgres
        image: postgres:16.4-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: ideas
        - name: POSTGRES_USER
          value: ideas
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 70
          allowPrivilegeEscalation: false
        readinessProbe: &id001
          exec:
            command:
            - pg_isready
            - -U
            - ideas
          periodSeconds: 10
        livenessProbe: *id001
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: idea-validator
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: idea-validator
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: data
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: redis
        image: redis:7.4.1-alpine
        ports:
        - containerPort: 6379
        env: []
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
        readinessProbe: &id001
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
        livenessProbe: *id001
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: idea-validator
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
  - port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: idea-validator
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        tier: data
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.12.4
        ports:
        - containerPort: 6333
        env: []
        volumeMounts:
        - name: data
          mountPath: /qdrant/storage
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        readinessProbe: &id001
          httpGet:
            path: /readyz
            port: 6333
          periodSeconds: 10
        livenessProbe: *id001
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: idea-validator
spec:
  clusterIP: None
  selector:
    app: qdrant
  ports:
  - port: 6333
