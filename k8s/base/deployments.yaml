apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: idea-validator
  labels: &id001
    app: gateway
    tier: edge
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels: *id001
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
    spec:
      automountServiceAccountToken: false
      containers:
      - name: gateway
        image: registry/gateway:set-by-deploy
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: service-urls
        - configMapRef:
            name: common-config
        - secretRef:
            name: app-secrets
            optional: true
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: idea-validator
spec:
  selector:
    app: gateway
  ports:
  - port: 8000
    targetPort: 8000
---
