    tier: internal
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: scorer
  template:
    metadata:
      labels: *id001
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
    spec:
      automountServiceAccountToken: false
      containers:
      - name: scorer
        image: registry/scorer:set-by-deploy
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: service-urls
        - configMapRef:
            name: common-config
        - secretRef:
            name: app-secrets
            optional: true
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 20
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 3Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: models
          mountPath: /models
          readOnly: true
        env:
        - name: SCORER_BACKEND
          value: rule
        - name: MODEL_PATH
          value: /models/scorer.gguf
      volumes:
      - name: tmp
        emptyDir: {}
      - name: models
        persistentVolumeClaim:
          claimName: scorer-models
