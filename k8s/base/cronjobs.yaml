apiVersion: batch/v1
kind: CronJob
metadata:
  name: analyst-recompute
  namespace: idea-validator
spec:
  schedule: 30 4 * * *
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: recompute
            tier: internal
        spec:
          restartPolicy: OnFailure
          containers:
          - name: recompute
            image: registry/evaluation:set-by-deploy
            args:
            - python
            - -c
            - import httpx,os;[httpx.post(os.environ[k]+p,timeout=60) for k,p in (('KB_URL','/reload'),('ANALYST_URL','/recompute'))]
            envFrom:
            - configMapRef:
                name: service-urls
            - configMapRef:
                name: common-config
            - secretRef:
                name: app-secrets
                optional: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir: {}
