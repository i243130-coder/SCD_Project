apiVersion: batch/v1
kind: CronJob
metadata:
  name: scout-hn
  namespace: idea-validator
spec:
  schedule: 0 */6 * * *
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: scouts
            tier: internal
        spec:
          restartPolicy: OnFailure
          containers:
          - name: scout
            image: registry/scouts:set-by-deploy
            args:
            - python
            - -m
            - src.main
            - --source
            - hn
            envFrom:
            - configMapRef:
                name: service-urls
            - configMapRef:
                name: common-config
            - secretRef:
                name: app-secrets
                optional: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: raw
              mountPath: /data/raw
          volumes:
          - name: tmp
            emptyDir: {}
          - name: raw
            persistentVolumeClaim:
              claimName: scout-raw
---
